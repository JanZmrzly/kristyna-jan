<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Kristýna &amp; Jan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f6f6f5;
    --ink: #373737;
    --muted: #7d7a74;
    --gold: #9d915d;
    --gold-dark: #847949;
    --mocha: #7f634e;
    --rose: #a0675a;
    --line: rgba(55,55,55,0.22);
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; min-height:100%; background: var(--paper); }
  body{
    min-height: 100vh; min-height: 100svh;
    display:flex; align-items:center; justify-content:center;
    font-family:'Cormorant Garamond', Garamond, 'Times New Roman', serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .stage{
    width:100%; max-width:560px;
    padding: 40px 24px; text-align:center;
    transition: opacity .5s ease;
  }
  .stage.leaving{ opacity:0; }
  .names{ display:block; width: min(520px, 100%); margin: 0 auto 30px; }
  .question{
    margin: 0 0 26px;
    font-size: clamp(15px, 3.8vw, 18px); font-weight: 500;
    letter-spacing: 0.22em; text-transform: uppercase;
  }
  .question::after{
    content:""; display:block; width: 44px; height: 1px; margin: 22px auto 0; background: var(--gold);
  }
  form{ display:flex; flex-direction:column; align-items:center; gap: 14px; }
  .field{ display:flex; gap: 10px; width:100%; max-width: 360px; }
  form{ position: relative; }
  .datebox{
    flex:1; min-width:0; display:flex; align-items:stretch;
    background: #fbfbfa; border: 1px solid var(--line);
  }
  .datebox:focus-within{ border-color: var(--gold); background:#fff; }
  #date{
    flex:1; min-width:0; width: 100%;
    appearance: none; -webkit-appearance: none;
    background: transparent; border: none; border-radius: 0;
    color: var(--ink);
    font-family: inherit; font-size: 20px; font-weight: 500; letter-spacing: 0.08em;
    padding: 10px 0 10px 14px; min-height: 50px;
    text-align: center; font-variant-numeric: lining-nums tabular-nums;
  }
  #date::placeholder{ color: #a9a59c; }
  #date:focus{ outline: none; }
  button{ font-family: inherit; cursor: pointer; border: none; border-radius: 0; }
  button:focus-visible, select:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  .calbtn{
    background: transparent; color: var(--gold);
    padding: 0 12px; display:flex; align-items:center;
  }
  .calbtn:hover{ color: var(--gold-dark); }
  .gold{
    font-weight: 600; font-size: 13px; letter-spacing: 0.26em; text-transform: uppercase;
    color: #fff; background: var(--gold);
    padding: 0 22px; min-height: 50px;
    transition: background .2s ease;
  }
  .gold:hover{ background: var(--gold-dark); }
  .gold[disabled]{ opacity:.6; cursor: progress; }

  /* kalendář */
  .cal{
    width: 100%; max-width: 360px;
    background: #fff; border: 1px solid var(--line);
    box-shadow: 0 10px 30px rgba(55,55,55,0.12);
    padding: 14px 14px 12px;
  }
  .cal[hidden]{ display:none; }
  .cal-head{ display:flex; align-items:center; gap: 6px; margin-bottom: 10px; }
  .cal-head select{
    flex:1; min-width:0;
    font-family: inherit; font-size: 17px; font-weight: 600; color: var(--ink);
    background: transparent; border: 1px solid transparent; padding: 6px 4px;
    text-align: center; text-align-last: center; cursor: pointer;
    appearance: none; -webkit-appearance: none;
  }
  .cal-head select:hover{ border-color: var(--line); }
  .cal-head .nav{
    width: 38px; height: 38px; font-size: 24px; line-height: 1;
    color: var(--gold); background: transparent;
  }
  .cal-head .nav:hover{ color: var(--gold-dark); }
  .cal-dow, .cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-dow span{ font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 4px 0; }
  .cal-grid button{
    aspect-ratio: 1; width: 100%;
    font-size: 17px; font-weight: 500; color: var(--ink); background: transparent;
    border-radius: 50%; font-variant-numeric: lining-nums;
  }
  .cal-grid button:hover{ background: rgba(157,145,93,0.15); }
  .cal-grid button.sel{ background: var(--gold); color: #fff; }
  .cal-grid button.today{ box-shadow: inset 0 0 0 1px var(--line); }
  .status{ min-height: 1.5em; margin: 2px 0 0; font-size: 17px; font-style: italic; color: var(--muted); }
  .status.error{ color: var(--rose); }
  .hint{ margin: 26px auto 0; max-width: 320px; font-size: 16px; line-height: 1.5; color: var(--muted); }
  .shake{ animation: shake .4s ease; }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-6px); } 40%{ transform: translateX(6px); }
    60%{ transform: translateX(-4px); } 80%{ transform: translateX(4px); }
  }
  noscript p{ color: var(--rose); }
  @media (prefers-reduced-motion: reduce){ .shake{ animation:none; } .stage{ transition:none; } }
</style>
</head>

    let a=H[0], b=H[1], c=H[2], d=H[3], e=H[4], f=H[5], g=H[6], h=H[7];
    for (let t = 0; t < 64; t++){
      const S1 = ((e>>>6)|(e<<26)) ^ ((e>>>11)|(e<<21)) ^ ((e>>>25)|(e<<7));
      const t1 = (h + S1 + ((e & f) ^ (~e & g)) + K[t] + W[t]) | 0;
      const S0 = ((a>>>2)|(a<<30)) ^ ((a>>>13)|(a<<19)) ^ ((a>>>22)|(a<<10));
      const t2 = (S0 + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }

  // dohashuje zprávu za již zpracovaným prefixem délky prefixLen bajtů
  function hashWith(Hinit, prefixLen, msg){
    const H = Hinit.slice(), W = new Int32Array(64);
    const padLen = ((msg.length + 9 + 63) >> 6) << 6;
    const buf = new Uint8Array(padLen); buf.set(msg); buf[msg.length] = 0x80;
    const dv = new DataView(buf.buffer);
    const bits = (prefixLen + msg.length) * 8;
    dv.setUint32(padLen - 8, Math.floor(bits / 4294967296));
    dv.setUint32(padLen - 4, bits >>> 0);
    for (let off = 0; off < padLen; off += 64){
      for (let i = 0; i < 16; i++) W[i] = dv.getInt32(off + i * 4);
      compress(H, W);
    }
    return H;
  }
  function toBytes(H){
    const out = new Uint8Array(32), dv = new DataView(out.buffer);
    for (let i = 0; i < 8; i++) dv.setInt32(i * 4, H[i]);
    return out;
  }
  function hmacPre(key){
    if (key.length > 64) key = toBytes(hashWith(IV0, 0, key));
    const ip = new Uint8Array(64), op = new Uint8Array(64);
    ip.set(key); op.set(key);
    for (let i = 0; i < 64; i++){ ip[i] ^= 0x36; op[i] ^= 0x5c; }
    const load = (block) => {
      const H = IV0.slice(), W = new Int32Array(64), dv = new DataView(block.buffer);
      for (let i = 0; i < 16; i++) W[i] = dv.getInt32(i * 4);
      compress(H, W); return H;
    };
    return { i: load(ip), o: load(op) };
  }
  function hmac(pre, msg){
    return toBytes(hashWith(pre.o, 64, toBytes(hashWith(pre.i, 64, msg))));
  }
  function pbkdf2(password, salt, iter){
    const pre = hmacPre(password);
    const s = new Uint8Array(salt.length + 4); s.set(salt); s[s.length - 1] = 1;
    const u0 = hmac(pre, s), dv0 = new DataView(u0.buffer);
    const U = new Int32Array(8), T = new Int32Array(8), H = new Int32Array(8), W = new Int32Array(64);
    for (let k = 0; k < 8; k++){ U[k] = dv0.getInt32(k * 4); T[k] = U[k]; }
    W[8] = 0x80000000 | 0; W[15] = 768; // 64 B klíč + 32 B zpráva
    for (let j = 1; j < iter; j++){
      H.set(pre.i); for (let k = 0; k < 8; k++) W[k] = U[k];
      compress(H, W);
      for (let k = 0; k < 8; k++) W[k] = H[k];
      H.set(pre.o); compress(H, W);
      for (let k = 0; k < 8; k++){ U[k] = H[k]; T[k] ^= H[k]; }
    }
    return toBytes(T);
  }

  const nextFrame = () => new Promise(r => setTimeout(r, 0));
  async function decrypt(password){
    await nextFrame(); // nechat prohlížeč vykreslit „Ověřuji…“
    const enc = new TextEncoder();
    const salt = b64(P.salt), iv = b64(P.iv), ct = b64(P.ct), tag = b64(P.tag);
    const master = hmacPre(pbkdf2(enc.encode(password), salt, P.iter));
    const kMac = hmacPre(hmac(master, enc.encode('mac')));
    const macMsg = new Uint8Array(iv.length + ct.length); macMsg.set(iv); macMsg.set(ct, iv.length);
    const check = hmac(kMac, macMsg);
    let diff = 0; for (let i = 0; i < 32; i++) diff |= check[i] ^ tag[i];
    if (diff) throw new Error('špatné heslo');
    const kEnc = hmacPre(hmac(master, enc.encode('enc')));
    const out = new Uint8Array(ct.length), ctr = new Uint8Array(iv.length + 4);
    ctr.set(iv); const cdv = new DataView(ctr.buffer);
    for (let off = 0, i = 0; off < ct.length; off += 32, i++){
      cdv.setUint32(iv.length, i);
      const ks = hmac(kEnc, ctr);
      const n = Math.min(32, ct.length - off);
      for (let j = 0; j < n; j++) out[off + j] = ct[off + j] ^ ks[j];
    }
    return new TextDecoder().decode(out);
  }

  function store(pw){ try { localStorage.setItem(STORE_KEY, pw); } catch(e){} }
  function recall(){ try { return localStorage.getItem(STORE_KEY); } catch(e){ return null; } }
  function forget(){ try { localStorage.removeItem(STORE_KEY); } catch(e){} }

  function reveal(html){
    document.open();
    document.write(html);
    document.close();
  }

  let attempt = 0;
  async function tryUnlock(pw, loud){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(pw)) {
      if (loud) fail('Vyberte prosím celé datum.');
      return false;
    }
    const mine = ++attempt;
    if (loud){ btn.disabled = true; setStatus('Ověřuji…'); }
    try {
      const html = await decrypt(pw);
      if (mine !== attempt && !loud) return false;
      store(pw);
      stage.classList.add('leaving');
      setTimeout(() => reveal(html), matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 450);
      return true;
    } catch(e){
      if (loud && mine === attempt) fail('To není ono. Zkuste to prosím znovu.');
      return false;
    } finally {
      if (loud) btn.disabled = false;
    }
  }

  function setStatus(msg, isError){
    status.textContent = msg;
    status.classList.toggle('error', !!isError);
  }
  function fail(msg){
    setStatus(msg, true);
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
  }

  // ---- datum ve tvaru dd/mm/yyyy ----
  function toIso(text){
    const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(text.trim());
    if (!m) return '';
    return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  }
  function fromParts(y, mo, d){
    return String(d).padStart(2, '0') + '/' + String(mo + 1).padStart(2, '0') + '/' + y;
  }

  // automatické lomítko při psaní
  input.addEventListener('input', (e) => {
    let digits = input.value.replace(/\D/g, '').slice(0, 8);
    let out = digits.slice(0, 2);
    if (digits.length > 2) out += '/' + digits.slice(2, 4);
    if (digits.length > 4) out += '/' + digits.slice(4);
    if (e.inputType && e.inputType.startsWith('delete')) out = input.value; // nemazat lomítka násilím
    input.value = out;
    setStatus('');
    if (digits.length === 8 && !(e.inputType || '').startsWith('delete')) tryUnlock(toIso(input.value), true);
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    closeCal();
    tryUnlock(toIso(input.value), true);
  });

  // ---- kalendář ----
  const MONTHS = ['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];
  const cal = $('cal'), grid = $('grid'), selM = $('month'), selY = $('year'), calbtn = $('calbtn');
  const now = new Date();
  let viewY = now.getFullYear(), viewM = now.getMonth();
  MONTHS.forEach((name, i) => selM.add(new Option(name, i)));
  for (let y = 2025; y <= 2029; y++) selY.add(new Option(y, y));

  function render(){
    viewY = Math.min(2029, Math.max(2025, viewY));
    selM.value = viewM; selY.value = viewY;
    grid.innerHTML = '';
    const first = new Date(viewY, viewM, 1);
    const offset = (first.getDay() + 6) % 7; // pondělí první
    const days = new Date(viewY, viewM + 1, 0).getDate();
    const chosen = toIso(input.value);
    for (let i = 0; i < offset; i++) grid.appendChild(document.createElement('span'));
    for (let d = 1; d <= days; d++){
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = d;
      const text = fromParts(viewY, viewM, d);
      b.setAttribute('aria-label', d + '. ' + MONTHS[viewM] + ' ' + viewY);
      if (toIso(text) === chosen) b.classList.add('sel');
      if (viewY === now.getFullYear() && viewM === now.getMonth() && d === now.getDate()) b.classList.add('today');
      b.addEventListener('click', () => {
        input.value = text;
        closeCal();
        tryUnlock(toIso(text), true);
      });
      grid.appendChild(b);
    }
  }
  function openCal(){
    const iso = toIso(input.value);
    if (iso){ viewY = +iso.slice(0, 4); viewM = +iso.slice(5, 7) - 1; }
    render();
    cal.hidden = false; calbtn.setAttribute('aria-expanded', 'true');
  }
  function closeCal(){ cal.hidden = true; calbtn.setAttribute('aria-expanded', 'false'); }
  calbtn.addEventListener('click', () => cal.hidden ? openCal() : closeCal());
  input.addEventListener('focus', () => { if (!input.value) openCal(); });
  selM.addEventListener('change', () => { viewM = +selM.value; render(); });
  selY.addEventListener('change', () => { viewY = +selY.value; render(); });
  $('prev').addEventListener('click', () => { if (--viewM < 0){ viewM = 11; viewY--; } render(); });
  $('next').addEventListener('click', () => { if (++viewM > 11){ viewM = 0; viewY++; } render(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCal(); });
  document.addEventListener('click', (e) => { if (!form.contains(e.target)) closeCal(); });

  // vracející se host — zkusit uložené datum
  const saved = recall();
  if (saved){
    setStatus('Odemykám…');
    tryUnlock(saved, false).then(ok => { if (!ok){ forget(); setStatus(''); } });
  }
})();
</script>
</body>
